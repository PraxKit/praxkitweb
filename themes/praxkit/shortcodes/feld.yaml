name: feld
description: One field of a `wandlung`. The body is the sentence, written on its own lines.
params:
  - name: typ
    type: enum
    values: [imperativ, konstatierend]
    required: true
    description: imperativ (alarm tint) or konstatierend (calm tint).
  - name: label
    type: string
    required: false
    description: Small caption above the sentence. Defaults per typ.
body: markdown
